<!DOCTYPE html>
<html lang="en" class="bg-[#0b0b10]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TDub — Watch Anime, Dubs & Movies</title>
  <meta name="description" content="TDub — stream trending anime, the latest dubs and popular movies in HD." />
  <meta name="theme-color" content="#0b0b10" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { DEFAULT: '#e11d48', dark: '#be123c' }, ink: '#0b0b10', panel: '#15151d' } } },
    };
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="has-ad-bar bg-ink text-gray-100 antialiased min-h-screen" data-page="home">

  <!-- Header -->
  <header id="siteHeader" class="fixed top-0 inset-x-0 z-40 transition-colors duration-300 bg-gradient-to-b from-black/80 to-transparent">
    <div class="max-w-[1600px] mx-auto px-4 md:px-8 h-16 flex items-center gap-4">
      <a href="/" class="text-2xl md:text-3xl font-black tracking-wider select-none" aria-label="TDub home">
        T<span class="text-brand">DUB</span>
      </a>
      <nav class="hidden md:flex items-center gap-5 text-sm text-gray-300 ml-4">
        <button type="button" data-filter="all" class="filter-btn hover:text-white text-white font-semibold">Home</button>
        <button type="button" data-filter="series" class="filter-btn hover:text-white">Series</button>
        <button type="button" data-filter="movie" class="filter-btn hover:text-white">Movies</button>
      </nav>
      <div class="ml-auto relative w-40 sm:w-64">
        <input id="searchInput" type="search" placeholder="Search titles..." autocomplete="off"
          class="w-full bg-black/60 border border-white/15 rounded-full pl-9 pr-3 py-1.5 text-sm placeholder-gray-500 focus:outline-none focus:border-brand" />
        <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </div>
    </div>
    <!-- Mobile filters -->
    <nav class="md:hidden flex gap-4 px-4 pb-2 text-sm text-gray-300">
      <button type="button" data-filter="all" class="filter-btn text-white font-semibold">Home</button>
      <button type="button" data-filter="series" class="filter-btn">Series</button>
      <button type="button" data-filter="movie" class="filter-btn">Movies</button>
    </nav>
  </header>

  <main>
    <!-- Hero (filled by app.js) -->
    <section id="hero" class="relative h-[62vh] min-h-[380px] max-h-[640px] hidden">
      <div id="heroBg" class="absolute inset-0 bg-center bg-cover"></div>
      <div class="absolute inset-0 bg-gradient-to-r from-ink via-ink/70 to-transparent"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-ink via-transparent to-transparent"></div>
      <div class="relative h-full max-w-[1600px] mx-auto px-4 md:px-8 flex flex-col justify-end pb-12 md:pb-16">
        <div class="max-w-xl">
          <div id="heroMeta" class="flex items-center gap-2 text-xs mb-3"></div>
          <h1 id="heroTitle" class="text-3xl md:text-5xl font-extrabold leading-tight drop-shadow"></h1>
          <p id="heroDesc" class="mt-3 text-gray-300 text-sm md:text-base clamp-3"></p>
          <div class="mt-5 flex gap-3">
            <a id="heroPlay" href="#" class="inline-flex items-center gap-2 bg-brand hover:bg-brand-dark text-white font-semibold px-6 py-2.5 rounded-md transition">
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Watch Now
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- Loading -->
    <div id="loading" class="flex flex-col items-center justify-center gap-4 pt-40 pb-24" role="status" aria-live="polite">
      <div class="tdub-spinner"></div>
      <p class="text-gray-400 text-sm">Loading the TDub library…</p>
    </div>

    <!-- Error -->
    <div id="errorBox" class="hidden max-w-md mx-auto mt-40 text-center px-4">
      <p class="text-lg font-semibold">Couldn’t load the catalog.</p>
      <p id="errorText" class="text-gray-400 text-sm mt-2">The server may be waking up. Please try again in a few seconds.</p>
      <button id="retryBtn" type="button" class="mt-5 bg-brand hover:bg-brand-dark px-5 py-2 rounded-md font-semibold">Retry</button>
    </div>

    <!-- Rows (filled by app.js) -->
    <div id="rows" class="relative z-10 max-w-[1600px] mx-auto px-4 md:px-8 space-y-10 pb-10"></div>

    <!-- Empty state -->
    <div id="emptyBox" class="hidden text-center text-gray-400 py-24 px-4">
      <p class="text-lg">No titles found.</p>
    </div>
  </main>

  <footer class="border-t border-white/5 text-center text-xs text-gray-500 py-6">
    © <span id="year"></span> TDub. All rights reserved.
  </footer>

  <!-- Sticky bottom banner ad (non-intrusive, closable) -->
  <div id="adBar" class="fixed bottom-0 inset-x-0 z-30 bg-black/90 backdrop-blur border-t border-white/10">
    <div class="relative max-w-[760px] mx-auto flex items-center justify-center py-2 px-8">
      <span class="absolute left-2 top-1 text-[10px] uppercase tracking-wider text-gray-500">Ad</span>
      <!--
        Paste your ad network's banner code inside #adSlot.
        Desktop: 728x90 leaderboard. Mobile: 320x50 strip.
        Use banner formats only (no pop-unders / interstitials).
      -->
      <div id="adSlot" class="w-[320px] h-[50px] md:w-[728px] md:h-[90px] flex items-center justify-center rounded bg-white/5 border border-dashed border-white/10 text-gray-500 text-xs overflow-hidden">
        Advertisement
      </div>
      <button id="adClose" type="button" aria-label="Close ad" class="absolute right-1 top-1 w-6 h-6 rounded-full text-gray-400 hover:text-white hover:bg-white/10 text-sm leading-none">✕</button>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
